<!DOCTYPE html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width" />

<title>Analysis - Pokemon Showdown!</title>

<link rel="icon" href="../play.pokemonshowdown.com/favicon.ico" />
<!-- global.css references root-relative images (/images/...), so it only works from the main site -->
<link rel="stylesheet" href="//pokemonshowdown.com/style/global.css" />
<link rel="stylesheet" href="../play.pokemonshowdown.com/style/font-awesome.css?" />
<link rel="stylesheet" href="../play.pokemonshowdown.com/style/client.css?" />
<link rel="stylesheet" href="../play.pokemonshowdown.com/style/client2.css?" />
<link rel="stylesheet" href="../play.pokemonshowdown.com/style/battle.css?" />
<link rel="stylesheet" href="../play.pokemonshowdown.com/style/sim-types.css?" />
<!-- the embedded teambuilder (battle-team-editor.js) needs these -->
<link rel="stylesheet" href="../play.pokemonshowdown.com/style/battle-log.css?" />
<link rel="stylesheet" href="../play.pokemonshowdown.com/style/teambuilder.css?" />
<link rel="stylesheet" href="../play.pokemonshowdown.com/style/battle-search.css?" />
<link rel="stylesheet" href="../play.pokemonshowdown.com/style/utilichart.css?" />

<style>
	:root { color-scheme: light; }
	body { background: #f1f4f6; }
	.analysis-shell { width: 100%; margin: 0; padding: 0; }
	.analysis-panel { min-height: calc(100vh - 120px); margin: 0; padding: 0; }
	.analysis-shell > .header { position: relative; z-index: 12; }
	.analysis-shell > .header .nav { height: 49px; margin: 0; }
	.analysis-shell > .header .nav .button { height: 34px; margin-top: 6px; padding-top: 7px; padding-bottom: 7px; box-sizing: border-box; font-size: 9pt; }
	.analysis-home { max-width: 980px; margin: 30px auto; }
	.analysis-home h1 { margin-bottom: 4px; }
	.analysis-home > p { color: #53616b; }
	.analysis-options { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 22px 0; }
	.analysis-option { min-height: 92px; text-align: left; }
	.analysis-option strong, .analysis-option small { display: block; }
	.analysis-option small { margin-top: 7px; white-space: normal; color: #53616b; }
	.analysis-form { max-width: 620px; padding: 18px; background: #fff; border: 1px solid #cbd4da; border-radius: 6px; }
	.analysis-form label { display: block; margin: 12px 0; }
	.analysis-form select, .analysis-form input[type="text"], .analysis-form textarea { box-sizing: border-box; width: 100%; max-width: 520px; padding: 6px; }
	.analysis-form textarea { min-height: 190px; font: 9pt monospace; }
	.analysis-form .button { margin-right: 6px; }
	.analysis-team-preview { display: block; margin-top: 5px; }
	.analysis-team-preview strong, .analysis-team-preview small { display: block; }
	.analysis-team-preview .picon { display: inline-block; vertical-align: middle; margin-right: 2px; }
	.analysis-battle-stage > .battle-controls { bottom: 0; box-sizing: border-box; overflow-y: auto; }
	.analysis-choice-summary-wrap { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 18px; min-width: 0; margin: 6px 0; overflow: hidden; font: 9pt monospace; color: #53616b; }
	.analysis-choice-summary { display: flex; align-items: center; min-width: 0; overflow: hidden; white-space: nowrap; }
	.analysis-choice-summary .picon { flex: 0 0 auto; }
	.analysis-choice-selectable { cursor: pointer; border-radius: 3px; }
	.analysis-choice-selectable:hover { background: #dbeaf4; }
	.analysis-selection-heading { display: flex; align-items: center; gap: 8px; }
	.analysis-action-controls { display: flex; flex-direction: column; width: 100%; min-width: 0; }
	.analysis-action-controls .movecontrols, .analysis-action-controls .switchcontrols { flex: none; box-sizing: border-box; width: 100%; min-width: 0; max-width: none; }
	.analysis-action-controls .movemenu, .analysis-action-controls .switchmenu { display: flex; box-sizing: border-box; width: 100%; min-width: 0; margin-right: 0; padding-left: 4px; }
	.analysis-action-controls .movemenu button, .analysis-action-controls .switchmenu button { float: none; flex: 1 1 0; width: auto; min-width: 0; margin-right: 4px; white-space: nowrap; overflow: hidden; }
	.analysis-action-controls .movebutton { max-width: 155px; height: auto; min-height: 40px; }
	.analysis-action-controls .switchmenu button { max-width: 102px; }
	.analysis-choice-controls .megaevo-box { margin: 5px 0; }
	.analysis-choice-controls .megaevo { display: inline-block; margin-right: 8px; padding: 3px 6px; border: 1px solid #aaa; background: #eef2f5; }
	.analysis-choice-controls .megaevo.cur { background: #c7e7ff; }
	.analysis-debug-log { margin: 0; white-space: pre-wrap; word-break: break-word; font: 8pt monospace; color: #33434d; }
	.analysis-node-tree, .analysis-node-branch > ol { margin: 0; padding: 0; list-style: none; }
	.analysis-node-tree { margin: 0 8px 16px; }
	.analysis-node-entry { position: relative; margin: 3px 0; }
	.analysis-node-branch { margin: 3px 0; padding-left: 16px; border-left: 2px solid #8ba4b3; list-style: none; }
	.analysis-node-button { display: block; box-sizing: border-box; width: 100%; min-width: 0; padding: 4px 6px; overflow: hidden; border: 0; background: transparent; color: inherit; text-align: left; cursor: pointer; }
	.analysis-node-button > strong { display: block; }
	/* the end-of-game node's result, where a turn node shows its chosen actions */
	.analysis-node-outcome { display: block; margin: 6px 0 0; font: 9pt monospace; color: #53616b; }
	.analysis-node-button .analysis-choice-summary-wrap { margin-bottom: 0; }
	.analysis-node-button:hover, .analysis-node-current .analysis-node-button { background: #dbeaf4; }
	.analysis-node-tooltip { visibility: hidden; position: fixed; z-index: 30; top: 0; left: 0; pointer-events: none; box-sizing: border-box; width: 360px; max-width: calc(100vw - 16px); padding: 8px 10px; border: 1px solid #64757f; background: #26343d; color: #fff; font-size: 9pt; font-weight: normal; line-height: 1.35; white-space: normal; box-shadow: 0 2px 6px rgba(0, 0, 0, .25); }
	.analysis-node-button:hover + .analysis-node-tooltip { visibility: visible; }
	.analysis-node-tooltip > strong, .analysis-node-tooltip .analysis-simulation-actions, .analysis-node-tooltip .analysis-simulation-actions > span { display: block; }
	.analysis-node-tooltip .analysis-simulation-actions { margin-top: 6px; color: #fff; }
	.analysis-simulation-list { margin: 0; padding: 0; list-style: none; }
	.analysis-simulation-group { margin: 0; padding: 0; }
	.analysis-simulation-outcome { box-sizing: border-box; width: 100%; min-width: 0; padding: 9px 10px; border: 0; border-bottom: 1px solid #bbc7cd; background: #f7f9fa; color: #26343d; text-align: left; cursor: pointer; }
	.analysis-simulation-outcome:hover, .analysis-simulation-outcome.hovered { background: #e8f1f5; }
	.analysis-simulation-outcome.selected { background: #cfe5f1; box-shadow: inset 3px 0 #2b79a2; }
	.analysis-simulation-outcome.selected.hovered { background: #bddbea; }
	.analysis-simulation-list strong, .analysis-simulation-list span, .analysis-simulation-list small { display: block; overflow-wrap: anywhere; }
	.analysis-simulation-list small { margin-top: 2px; color: #53616b; font: 8pt monospace; }
	.analysis-simulation-actions { margin-top: 6px; color: #40515c; }
	.analysis-simulation-actions > span { min-height: 24px; line-height: 24px; }
	.analysis-simulation-actions .picon { display: inline-block; vertical-align: middle; }
	.analysis-execution-separator { margin: 7px 0; color: #687780; font-weight: bold; text-align: center; text-transform: uppercase; }
	.analysis-radio-group { display: flex; align-items: center; gap: 12px; margin: 8px 0; padding: 4px 8px 6px; border: 1px solid #c4cdd2; }
	.analysis-radio-group legend { padding: 0 4px; color: #40515c; font-weight: bold; }
	.analysis-radio-group label { white-space: nowrap; cursor: pointer; }
	.analysis-grouping-mode { align-items: flex-start; flex-direction: column; gap: 5px; }
	.analysis-grouping-mode label:has(input:disabled) { cursor: default; opacity: .6; }
	.analysis-grouping-help { display: inline-block; position: relative; margin-left: 4px; color: #53616b; cursor: help; }
	.analysis-grouping-help::after { position: absolute; z-index: 20; top: calc(100% + 5px); left: 0; display: none; box-sizing: border-box; width: 360px; max-width: calc(100vw - 48px); padding: 7px 9px; border: 1px solid #64757f; background: #26343d; color: #fff; font-size: 9pt; font-weight: normal; line-height: 1.35; white-space: normal; content: attr(data-help); box-shadow: 0 2px 6px rgba(0, 0, 0, .25); }
	.analysis-grouping-help:hover::after { display: block; }
	/* the same hover tooltip at the right of the controls' button row, with a line per instruction. It is
	   labelled rather than a bare icon: what it holds is how to drive the battle, not a note about a field */
	.analysis-controls-help { float: right; margin: 10px 2px 0 8px; border-bottom: 1px dotted #8ba4b3; font-size: 9pt; }
	.analysis-controls-help::after { right: 0; left: auto; white-space: pre-line; }
	/* sits beside Submit/Simulate, so it uses the panel's small-caps label and a number input sized to it */
	.analysis-sim-count { display: inline-flex; align-items: center; gap: 6px; margin-left: 6px; vertical-align: middle; cursor: pointer; }
	.analysis-sim-count .analysis-number-input { width: 5em; text-align: right; cursor: text; }
	@media (max-width: 1050px) { .analysis-options { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
	@media (max-width: 650px) { .analysis-options { grid-template-columns: 1fr; } }
	#tooltipwrapper .tooltip-analysismove, #tooltipwrapper .tooltip-analysischoice { width: 440px; }
	.analysis-node-edits { margin-bottom: 6px; }
	.analysis-node-edits > strong, .analysis-node-edits span { display: block; }
	.analysis-node-edits-teams { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 12px; margin-top: 3px; }
	.analysis-node-edits-teams em { display: block; color: #b8c7d0; }
	.analysis-calc-lines { line-height: 1.6; }
	/* field edit form (analysis-field-editor.tsx); buttons copy calc.pokemonshowdown.com's .btn */
	.analysis-field-editor { margin-top: 8px; padding-top: 6px; border-top: 1px solid #c4cdd2; }
	.analysis-field-heading { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 6px; }
	.analysis-field-rows { display: flex; flex-direction: column; align-items: center; gap: 5px; }
	.analysis-field-row { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 5px 10px; }
	/* per-side state rather than a field effect, so it keeps its label beside the input; the label matches
	   the segmented buttons' font, and Side 2 mirrors the input to the left as its toggles mirror */
	.analysis-field-fainted { align-items: center; gap: 6px; }
	.analysis-field-fainted label { color: #222; font: 8pt Verdana, Helvetica, Arial, sans-serif; white-space: nowrap; }
	.analysis-field-fainted .analysis-field-turns { width: 44px; }
	.analysis-field-side-p2 .analysis-field-fainted { flex-direction: row-reverse; }
	.analysis-field-sides { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 14px; margin-top: 10px; }
	.analysis-field-joined { gap: 0; }
	/* joined rows overlap borders by moving whole items (button and input), not just the buttons */
	.analysis-field-joined > .analysis-field-item + .analysis-field-item { margin-left: -1px; }
	.analysis-field-joined .analysis-field-button.btn-mid, .analysis-field-joined .analysis-field-button.btn-right { margin-left: 0; }
	.analysis-field-side { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; min-width: 0; }
	/* a quieter label than the "Edit Field" heading above: matches the Pokémon panel's group labels */
	.analysis-field-side-title { color: #53616b; font-size: 8pt; font-weight: bold; text-transform: uppercase; letter-spacing: .04em; }
	.analysis-field-side-p1 .analysis-field-row { justify-content: flex-start; }
	.analysis-field-side-p2 { align-items: flex-end; }
	.analysis-field-side-p2 .analysis-field-row { justify-content: flex-end; }
	.analysis-field-item { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
	.analysis-field-stacked { flex-direction: column; }
	.analysis-field-actions { display: flex; gap: 6px; }
	.analysis-field-segmented { display: inline-flex; }
	.analysis-field-button { position: relative; box-sizing: border-box; min-width: 3.5em; margin: 0; padding: 3px 8px; border: 1px solid #aaa; border-radius: 5px; background: #e3e3e3; background: linear-gradient(to bottom, #f6f6f6, #d3d3d3); box-shadow: 0 1px 2px rgba(0, 0, 0, .2), inset 0 -1px 2px #fff; color: #222; text-shadow: 0 1px 0 #fff; font: 8pt Verdana, Helvetica, Arial, sans-serif; text-align: center; cursor: pointer; }
	.analysis-field-button.btn-single { min-width: 7em; }
	/* reserve the bold label's width, so selecting a button doesn't shift its row */
	.analysis-field-button::after { content: attr(data-label); display: block; height: 0; overflow: hidden; visibility: hidden; font-weight: bold; }
	.analysis-field-button:hover:not(:disabled), .analysis-field-button:focus-visible { z-index: 1; border-color: #606060; background: linear-gradient(to bottom, #f2f2f2, #b2b2b2); }
	.analysis-field-button:active:not(:disabled) { background: linear-gradient(to bottom, #bfbfbf, #f2f2f2); }
	.analysis-field-button.selected, .analysis-field-button.selected:hover:not(:disabled) { background: #fff; border-color: #ccc; box-shadow: 0 1px 2px rgba(0, 0, 0, .1); color: #000; font-weight: bold; text-shadow: none; }
	.analysis-field-button.selected:hover:not(:disabled) { border-color: #606060; }
	.analysis-field-button:disabled { color: #999; cursor: default; }
	.analysis-field-button.btn-left { border-top-right-radius: 0; border-bottom-right-radius: 0; }
	.analysis-field-button.btn-mid { margin-left: -1px; border-radius: 0; }
	.analysis-field-button.btn-right { margin-left: -1px; border-top-left-radius: 0; border-bottom-left-radius: 0; }
	.analysis-field-turns { box-sizing: border-box; width: 44px; padding: 1px 3px; }
	.analysis-field-turns:disabled { border-color: #ccc; background: #eee; color: #999; }
	/*
	 * Narrow and short, like the damage calculator's boost pickers. client.css forces every `.select` to
	 * 32px, which towers over the 19px EV/IV inputs beside them in the same stat row.
	 */
	.analysis-boost-select { box-sizing: border-box; width: 4.2em; min-width: 0; height: 20px; padding: 0 2px; font-size: 8pt; }
	/*
	 * Pokémon edit panel (analysis-pokemon-editor.tsx), laid out like the damage calculator's poke-info:
	 * boxed "info groups" stacked down the panel. calc.pokemonshowdown.com's own class names aren't in this
	 * client's CSS, so these are our own approximations of that look.
	 */
	/* the Lines panel's own colour (client2.css `.ps-room-light`), as a solid value: these sit on the opaque
	   room, so a group still reads as raised against it without being near-white */
	.analysis-info-group { margin: 6px 0; padding: 6px 8px; border: 1px solid #c4cdd2; border-radius: 4px; background: #f2f7fa; }
	/* These come after .analysis-info-group on purpose: same specificity, so order decides the margin. */
	.analysis-action-summary { margin: 10px 0; }
	.analysis-action-summary .analysis-choice-summary-wrap { margin: 5px 0 0; }
	/*
	 * Team Preview: each side's heading, icons and count boxed together, the roster on one row. Two
	 * client2.css rules get in the way, both of which the play client opts out of with `wide-controls`
	 * (not used here, since that would widen the move menu too):
	 * - `.movecontrols, .switchcontrols` caps these at 330px, which is what made the group a half-width box
	 *   in a 640px panel;
	 * - `.switchmenu button` floats at a fixed 102px and the menu hangs 10px past its right edge, which
	 *   wrapped the roster onto a second line and pushed it through the group's border. Flex lets the row
	 *   share whatever width there is, shrinking below 102px to keep six on one line, while `max-width`
	 *   keeps that 102px as the ceiling so a short team looks like every other switch menu rather than
	 *   stretching two buttons across the panel.
	 */
	.analysis-switch-group { max-width: none; margin: 10px 0; }
	.analysis-switch-group .switchmenu { display: flex; flex-wrap: nowrap; gap: 4px; margin-right: 0; padding-left: 0; }
	.analysis-switch-group .switchmenu button { flex: 1 1 0; float: none; width: auto; max-width: 102px; min-width: 0; margin-right: 0; }
	.analysis-switch-group h3 { margin: 0; }
	.analysis-switch-count { margin: 6px 0 0; padding: 0; color: #53616b; font: 9pt monospace; }
	.analysis-info-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
	.analysis-info-row + .analysis-info-row { margin-top: 5px; }
	.analysis-info-field { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
	.analysis-info-field > label { color: #53616b; font-size: 8pt; }
	/*
	 * One field per row, with the labels sharing a column so every input's left edge lines up. The column is
	 * kept tight because a 2x2 cell has to fit a dropdown plus a second control beside it (Status and the
	 * badly-poisoned counter, or the sleep-turns input).
	 */
	.analysis-info-line { display: grid; grid-template-columns: 4.2em minmax(0, 1fr); align-items: center; gap: 4px 2px; }
	.analysis-info-line + .analysis-info-line { margin-top: 4px; }
	.analysis-info-line > label { color: #53616b; font-size: 8pt; }
	/*
	 * Nature/ability/item/status as a 2x2 block rather than four rows, which leaves the volatiles row below it
	 * the panel's full width for its combobox. `align-items: start` keeps the top row aligned when the status
	 * cell grows a second control (the badly-poisoned counter, or sleep turns).
	 */
	/*
	 * The columns are uneven on purpose: nature and item are lone dropdowns, while status shares its cell
	 * with the badly-poisoned counter or the sleep-turns input, so the right column gets the extra room.
	 */
	.analysis-info-grid { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); align-items: start; gap: 5px 12px; }
	.analysis-info-grid > .analysis-info-line + .analysis-info-line { margin-top: 0; }
	.analysis-info-grid + .analysis-info-line { margin-top: 6px; padding-top: 6px; border-top: 1px solid #e3e8eb; }
	.analysis-info-value { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; min-width: 0; }
	.analysis-info-value > select { min-width: 0; max-width: 13em; }
	.analysis-info-checkbox { display: flex; align-items: center; gap: 3px; color: #40515c; font-size: 8pt; white-space: nowrap; }
	.analysis-toxic-select { box-sizing: border-box; width: 5em; min-width: 0; }
	.analysis-number-input { box-sizing: border-box; width: 5.2em; padding: 1px 3px; }
	.analysis-stat-table { width: 100%; border-collapse: collapse; font-size: 8pt; }
	.analysis-stat-table th { padding: 1px 3px; color: #53616b; font-weight: normal; text-align: center; }
	.analysis-stat-table th:first-child { text-align: left; }
	.analysis-stat-table td { padding: 1px 3px; text-align: center; }
	.analysis-stat-table td:first-child { color: #40515c; font-weight: bold; text-align: left; }
	.analysis-stat-table .analysis-stat-base, .analysis-stat-table .analysis-stat-total { font-variant-numeric: tabular-nums; }
	.analysis-stat-table .analysis-stat-total { font-weight: bold; }
	.analysis-stat-input { box-sizing: border-box; width: 4.2em; padding: 1px 3px; text-align: right; }
	.analysis-move-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px; }
	/* Rage Fist's hit counter sits between its move and its PP, so the row needs a third column. It is
	   left-aligned in that column, unlike the PP cell which hugs the right edge of the row. */
	/* The hits column takes the free space so its input sits just after the move select, left-aligned;
	   without that the 1fr select pushes both it and the PP cell against the right edge. The select is
	   held to its column's width, or it overflows and covers the input. */
	.analysis-move-row:has(.analysis-move-hits) { grid-template-columns: minmax(0, 16em) minmax(0, 1fr) auto; }
	.analysis-move-row:has(.analysis-move-hits) > select { width: 100%; max-width: 100%; }
	.analysis-move-hits { display: flex; justify-content: flex-start; align-items: center; gap: 4px; white-space: nowrap; }
	.analysis-move-pp { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
	.analysis-move-row + .analysis-move-row { margin-top: 4px; }
	.analysis-move-row select { min-width: 0; }
	.analysis-move-row .analysis-stat-input { width: 3.6em; }
	.analysis-poke-actions { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
	/* settings popup (analysis-settings.tsx); `.userbar` and `.ps-popup` come from the old client's CSS */
	.analysis-settings-popup { position: absolute; top: 30px; right: 0; width: 15em; }
	.analysis-settings-note { color: #53616b; font-size: 8pt; }
	/*
	 * Multi-select combobox (analysis-multiselect.tsx), used for volatiles. The box wears `.textbox` for the
	 * panel's standard input chrome, but `:focus` can't fire on a div, so the focus ring is reproduced with
	 * `:focus-within`. The popup is absolutely positioned so filtering doesn't resize the panel underneath it.
	 */
	.analysis-multiselect { position: relative; flex: 1 1 auto; min-width: 0; }
	.analysis-multiselect-box { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; box-sizing: border-box; width: 100%; min-height: 22px; padding: 2px 3px; cursor: text; }
	.analysis-multiselect-box:focus-within { outline: 0 none; border-color: #004488; box-shadow: inset 0 1px 2px #d2d2d2, 0 0 6px #2266aa; background: #fff; }
	.analysis-multiselect-disabled, .analysis-multiselect-disabled:hover { background: #ccc; cursor: default; }
	.analysis-multiselect-chip { display: inline-flex; align-items: center; gap: 1px; padding: 0 1px 0 6px; border: 1px solid #b6c2cb; border-radius: 9px; background: #e9eff4; color: #24323c; font-size: 8pt; line-height: 15px; white-space: nowrap; }
	.analysis-multiselect-remove { padding: 0 4px; border: 0; background: none; color: #53616b; font-size: 9pt; line-height: 1; cursor: pointer; }
	.analysis-multiselect-remove:hover:not(:disabled) { color: #c0392b; }
	.analysis-multiselect-remove:disabled { color: #aaa; cursor: default; }
	.analysis-multiselect-input { flex: 1 1 7em; min-width: 7em; padding: 0; border: 0; outline: 0 none; background: none; font-family: inherit; font-size: 8pt; }
	.analysis-multiselect-list { position: absolute; z-index: 10; right: 0; left: 0; max-height: 11.5em; margin: 1px 0 0; padding: 0; overflow-y: auto; border: 1px solid #aaa; border-radius: 3px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,.25); list-style: none; }
	.analysis-multiselect-option { padding: 2px 6px; font-size: 8pt; cursor: pointer; }
	/* the tick is always in the box, so a selected option doesn't shift its neighbours' text */
	.analysis-multiselect-option::before { content: '\2713'; display: inline-block; width: 1.2em; color: #53616b; visibility: hidden; }
	.analysis-multiselect-option[aria-selected="true"] { color: #53616b; }
	.analysis-multiselect-option[aria-selected="true"]::before { visibility: visible; }
	.analysis-multiselect-option:hover { background: #eef3f7; }
	.analysis-multiselect-option.active { background: #d7e5f0; }
	/* options the sim would refuse: listed so they can be found, with the reason beside them */
	.analysis-multiselect-blocked { color: #999; cursor: default; }

	.analysis-teambuilder .tabbar { position: static; height: auto; top: auto; bottom: auto; left: auto; right: auto; }
